<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070b14">
<title>XAUUSD Trading Confirmation Engine</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#070b14;
  color:#e8edf7;
  font-family:Arial,Helvetica,sans-serif;
}
.container{max-width:1450px;margin:auto;padding:12px}
header,.card{
  background:#0c1320;
  border:1px solid #223049;
  border-radius:15px;
}
header{
  padding:17px;
  margin-bottom:12px;
}
h1{margin:0 0 5px;font-size:24px}
.subtitle{color:#91a0b8;font-size:12px}
.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:11px;
  padding:7px 11px;
  border-radius:20px;
  background:#111b2b;
  font-size:12px;
}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:#f59e0b;
}
.status.live .dot{background:#22c55e}
.status.error .dot{background:#ef4444}

.grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:12px;
}
.card{
  padding:14px;
  margin-bottom:12px;
}
.card h2{
  font-size:15px;
  margin:0 0 12px;
}
.price{
  font-size:30px;
  font-weight:bold;
}
.small{
  color:#8d9ab0;
  font-size:11px;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0;
}
button{
  border:1px solid #30415c;
  background:#111c2e;
  color:#dbe5f5;
  border-radius:8px;
  padding:9px 12px;
  cursor:pointer;
}
button.active{
  background:#1d4ed8;
  border-color:#3b82f6;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.chart{
  width:100%;
  height:650px;
  overflow:hidden;
  border-radius:10px;
  background:#080d17;
}
.chart iframe{
  width:100%;
  height:100%;
  border:0;
}
.decision{
  padding:17px;
  border-radius:13px;
  background:#111a29;
  border:1px solid #293952;
  margin-bottom:12px;
}
.decision.buy{border-color:#16734b}
.decision.sell{border-color:#8b2934}
.decision.wait{border-color:#8a6415}
.decisionTitle{
  font-size:24px;
  font-weight:bold;
  margin-top:4px;
}
.reason{
  margin-top:7px;
  color:#aab7ca;
  line-height:1.45;
  font-size:13px;
}
.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.metric{
  background:#101927;
  border:1px solid #24334a;
  padding:11px;
  border-radius:9px;
}
.metric .label{
  color:#8190a7;
  font-size:10px;
}
.metric .value{
  margin-top:5px;
  font-weight:bold;
  font-size:14px;
}
.signalBox{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:11px;
}
.signalItem{
  background:#0a111d;
  border:1px solid #27364d;
  padding:11px;
  border-radius:9px;
}
.signalItem b{
  display:block;
  margin-top:5px;
  font-size:16px;
}
.progress{
