<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XAUUSD Confirmation Engine</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#070b12;color:#e8edf5;font:14px Arial}
.app{max-width:1200px;margin:auto;padding:12px}
.card{background:#0d1420;border:1px solid #203047;border-radius:12px;padding:15px;margin-bottom:12px}
h1{margin:0 0 5px;font-size:21px}
.sub,.muted{color:#8290a3;font-size:12px}
.status{margin-top:12px;padding:10px;border-radius:8px;background:#111c29}
.ok{color:#55df9b}.err{color:#ff7180}.wait{color:#ffd166}
.price{font-size:30px;font-weight:bold;margin:8px 0}
.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
button{background:#111d2c;color:#ddd;border:1px solid #30435a;border-radius:7px;padding:9px 12px}
button.active{background:#25496c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.rows{margin-top:8px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #192537}
.row:last-child{border:0}
.value{font-weight:bold}
.decision{text-align:center;background:#101a27;border-radius:10px;padding:18px}
.decision b{display:block;font-size:28px;margin:7px}
.score{font-size:34px;font-weight:bold}
.buy{color:#50e19a}.sell{color:#ff6878}
.trade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.box{background:#101a27;border:1px solid #22344b;border-radius:8px;padding:12px}
.box span{display:block;color:#8290a3;font-size:11px;margin-bottom:5px}
iframe{width:100%;height:580px;border:0;border-radius:8px;background:#080d15}
pre{white-space:pre-wrap;word-break:break-word;color:#aebbd0;font-size:11px}
@media(max-width:750px){
 .grid{grid-template-columns:1fr}.full{grid-column:auto}
 .trade{grid-template-columns:1fr 1fr}
 iframe{height:520px}
}
</style>
</head>

<body>
<div class="app">

<div class="card">
<h1>🟡 XAUUSD Trading Confirmation Engine</h1>
<div class="sub">Live data • Multi-timeframe structure • BOS/CHoCH • Retest • R:R</div>
<div id="status" class="status">STARTING ENGINE...</div>
</div>

<div class="grid">

<div class="card">
<div class="muted">LIVE XAU/USD</div>
<div id="price" class="price">---</div>
<div id="candle" class="muted">Waiting for live data...</div>

<div class="buttons">
<button id="b15" class="active" onclick="chart('15')">15M</button>
