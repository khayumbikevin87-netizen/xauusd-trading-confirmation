<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XAUUSD Feed Diagnostic</title>

<style>
body{
  margin:0;
  padding:15px;
  background:#071018;
  color:#eee;
  font-family:Arial,sans-serif;
}
.box{
  background:#101d28;
  border:1px solid #29404f;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
h1{font-size:23px}
.status{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}
.live{color:#50e388}
.bad{color:#ff6570}
.warn{color:#ffc857}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#071018;
  padding:12px;
  border-radius:8px;
  overflow:auto;
  font-size:12px;
}
button{
  padding:12px 18px;
  background:#1c394b;
  border:1px solid #47718a;
  border-radius:8px;
  color:white;
  margin-right:7px;
}
</style>
</head>

<body>

<h1>XAUUSD Trading Confirmation</h1>

<div class="box">

<h3>Gold API</h3>

<div id="goldStatus" class="status warn">
TESTING...
</div>

<div>
Price:
<strong id="goldPrice">---</strong>
</div>

<pre id="goldResponse">Waiting...</pre>

</div>


<div class="box">

<h3>Twelve Data</h3>

<div id="tdStatus" class="status warn">
TESTING...
</div>

<div>
Candles:
<strong id="tdCount">---</strong>
</div>

<pre id="tdResponse">Waiting...</pre>

</div>


<div class="box">

<h3>Browser test</h3>

<div id="browserStatus">
Running JavaScript...
</div>

</div>


<div class="box">

<button onclick="testGold()">Test Gold API</button>

<button onclick="testTwelve()">Test Twelve Data</button>

<button onclick="runTests()">Test Both</button>

</div>


<script>

const API_KEY =
"394e133dfaf844d580ca4d8d1ca5d1da";


const GOLD_URL =
"https://api.gold-api.com/price/XAU";


function show(id,text){

  document.getElementById(id).textContent=text;

}


function status(id,text,cls){

  const el=document.getElementById(id);

  el.textContent=text;

  el.className="status "+cls;

}


/* =====================================================
   GOLD API TEST
===================================================== */

async function testGold(){

  status(
    "goldStatus",
    "CONNECTING...",
    "warn"
  );

  show(
    "goldResponse",
    "Sending request..."
  );

  try{

    const url=
      GOLD_URL+
      "?_="+Date.now();


    const response=
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const text=
      await response.text();


    show(
      "goldResponse",
      "HTTP STATUS: "+
      response.status+
      "\n\n"+
      text
    );


    if(!response.ok){

      throw new Error(
        "HTTP "+response.status
      );

    }


    const data=
      JSON.parse(text);


    if(
      data.price===undefined
    ){

      throw new Error(
        "Response has no price field"
      );

    }


    show(
      "goldPrice",
      "$"+Number(data.price).toFixed(2)
    );


    status(
      "goldStatus",
      "LIVE",
      "live"
    );

  }

  catch(error){

    status(
      "goldStatus",
      "FAILED",
      "bad"
    );


    show(
      "goldResponse",

      "ERROR:\n"+
      error.name+
      "\n\n"+
      error.message+
      "\n\n"+
      "This means the browser could not successfully retrieve the Gold API response."

    );

  }

}


/* =====================================================
   TWELVE DATA TEST
===================================================== */

async function testTwelve(){

  status(
    "tdStatus",
    "CONNECTING...",
    "warn"
  );

  show(
    "tdResponse",
    "Sending request..."
  );


  try{

    const url=
      "https://api.twelvedata.com/time_series"+
      "?symbol=XAU%2FUSD"+
      "&interval=5min"+
      "&outputsize=10"+
      "&timezone=Africa%2FNairobi"+
      "&order=desc"+
      "&apikey="+
      encodeURIComponent(API_KEY)+
      "&_="+Date.now();


    const response=
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const text=
      await response.text();


    show(
      "tdResponse",

      "HTTP STATUS: "+
      response.status+
      "\n\n"+
      text

    );


    if(!response.ok){

      throw new Error(
        "HTTP "+response.status
      );

    }


    const data=
      JSON.parse(text);


    if(
      !data.values||
      !Array.isArray(data.values)
    ){

      throw new Error(
        data.message||
        "No values array returned"
      );

    }


    show(
      "tdCount",
      data.values.length
    );


    status(
      "tdStatus",
      "LIVE",
      "live"
    );

  }

  catch(error){

    status(
      "tdStatus",
      "FAILED",
      "bad"
    );


    show(
      "tdResponse",

      "ERROR:\n"+
      error.name+
      "\n\n"+
      error.message+
      "\n\n"+
      "The full API response above will tell us whether this is an API-key, quota, CORS, network, or provider problem."

    );

  }

}


/* =====================================================
   RUN BOTH
===================================================== */

async function runTests(){

  show(
    "browserStatus",
    "JavaScript is running. Testing both external APIs..."
  );

  await testGold();

  await testTwelve();


  show(
    "browserStatus",
    "Tests completed. Read the two response boxes above."
  );

}


/* =====================================================
   START
===================================================== */

runTests();

</script>

</body>
</html>
