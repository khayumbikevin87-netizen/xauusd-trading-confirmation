<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Trading Confirmation Engine</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0f14;
  color:#e8edf3;
}

header{
  padding:18px;
  background:#111820;
  border-bottom:1px solid #26313d;
}

h1{
  margin:0;
  font-size:22px;
}

.subtitle{
  color:#8f9baa;
  margin-top:6px;
  font-size:13px;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:14px;
}

.panel{
  background:#111820;
  border:1px solid #26313d;
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

button{
  border:1px solid #34414f;
  background:#18212b;
  color:#e8edf3;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#22303d;
}

button.active{
  background:#30485c;
  border-color:#607b91;
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.card{
  background:#151d26;
  border:1px solid #293541;
  border-radius:10px;
  padding:12px;
}

.label{
  font-size:11px;
  color:#8e9aa7;
  text-transform:uppercase;
  margin-bottom:5px;
}

.value{
  font-size:16px;
  font-weight:bold;
}

.small{
  font-size:12px;
  color:#9da8b4;
  margin-top:5px;
}

.live{
  color:#6ee7a0;
}

.wait{
  color:#ffd166;
}

.bull{
  color:#6ee7a0;
}

.bear{
  color:#ff7b7b;
}

.neutral{
  color:#c4ccd5;
}

.signal-box{
  text-align:center;
  padding:20px;
  border-radius:12px;
  background:#151d26;
  border:1px solid #303c49;
}

.decision{
  font-size:30px;
  font-weight:900;
  margin:5px 0 10px;
}

.reason{
  font-size:14px;
  color:#b7c0ca;
  line-height:1.5;
}

.progress{
  height:9px;
  background:#26313c;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#6ee7a0;
  transition:.4s;
}

.chart-wrap{
  width:100%;
  height:700px;
  min-height:600px;
  border-radius:12px;
  overflow:hidden;
}

#tradingview_chart{
  width:100%;
  height:100%;
}

table{
  width:100%;
  border-collapse:collapse;
}

td{
  padding:9px 5px;
  border-bottom:1px solid #27323d;
  font-size:13px;
}

td:first-child{
  color:#8996a4;
}

.explain{
  line-height:1.55;
  color:#c3ccd5;
  font-size:14px;
}

.warning{
  background:#211b0d;
  border:1px solid #5d4b1b;
  padding:12px;
  border-radius:9px;
  color:#e9d27a;
}

.good{
  background:#102218;
  border:1px solid #275b3b;
  padding:12px;
  border-radius:9px;
  color:#8fe3ac;
}

@media(max-width:800px){
  .status-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .chart-wrap{
    height:620px;
    min-height:560px;
  }
}

@media(max-width:480px){
  .chart-wrap{
    height:560px;
    min-height:520px;
  }

  .decision{
    font-size:25px;
  }

  h1{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🟡 XAUUSD Trading Confirmation Engine</h1>
  <div class="subtitle">
    Selective multi-confirmation analysis • Real Twelve Data candles • TradingView chart
  </div>
</header>

<div class="container">

  <!-- CONTROLS -->
  <div class="panel">
    <div class="controls">
      <button class="tf active" data-tf="1
