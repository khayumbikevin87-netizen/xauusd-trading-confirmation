
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XAUUSD Trading Confirmation</title>
<style>
body{margin:0;background:#0b0f14;color:#eee;font-family:Arial}
header{padding:18px;background:#111820;border-bottom:1px solid #29323c}
h1{margin:0;font-size:21px}
.sub{color:#8d99a6;font-size:13px;margin-top:5px}
.card{margin:15px;padding:16px;background:#111820;border:1px solid #29323c;border-radius:12px}
.row{display:flex;justify-content:space-between;margin:10px 0}
.label{color:#8995a2}
.price{font-size:30px;font-weight:bold}
.live{color:#35d07f}
.bad{color:#ff6464}
#tv{height:500px;width:100%}
</style>
</head>

<body>

<header>
<h1>XAUUSD Trading Confirmation</h1>
<div class="sub">Live Gold • Adaptive Analysis Engine</div>
</header>

<div class="card">
<div class="row">
<span class="label">Data connection</span>
<span id="status">CONNECTING</span>
</div>

<div class="row">
<span class="label">XAUUSD spot</span>
<span id="price" class="price">---</span>
</div>

<div class="row">
<span class="label">Last update</span>
<span id="updated">---</span>
</div>
</div>

<div class="card" style="padding:0;overflow:hidden">
<div id="tv"></div>
</div>

<script>
async function updatePrice(){
  try{
    const r=await fetch(
      "https://api.gold-api.com/price/XAU",
      {cache:"no-store"}
    );

    if(!r.ok) throw new Error();

    const d=await r.json();

    document.getElementById("price").textContent=
      "$"+Number(d.price).toFixed(2);

    document.getElementById("updated").textContent=
      new Date().toLocaleTimeString();

    const s=document.getElementById("status");
    s.textContent="LIVE";
    s.className="live";

  }catch(e){
    const s=document.getElementById("status");
    s.textContent="DISCONNECTED";
    s.className="bad";
  }
}

updatePrice();
setInterval(updatePrice,5000);
</script>

<script>
window.addEventListener("load",function(){

  const script=document.createElement("script");

  script.src=
    "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";

  script.async=true;

  script.innerHTML=JSON.stringify({
    autosize:true,
    symbol:"OANDA:XAUUSD",
    interval:"15",
    timezone:"Africa/Nairobi",
    theme:"dark",
    style:"1",
    locale:"en",
    allow_symbol_change:false,
    hide_side_toolbar:false,
    withdateranges:true,
    save_image:false,
    calendar:false
  });

  document.getElementById("tv").appendChild(script);
});
</script>

</body>
</html>
